<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="북트렌드">
<link rel="apple-touch-icon" href="/apple-touch-icon.png">
<title>북트렌드 대시보드</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@500;600;700&family=Noto+Sans+KR:wght@400;500;700&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #f6f5fb;
    --card: #ffffff;
    --text: #2e2a3d;
    --text-dim: #9490a6;
    --accent: #7ed99b;
    --accent-dark: #278a52;
    --line: #eae7f6;
    --p-aladin-bg: #d8ecff; --p-aladin-fg: #2f6fa8;
    --p-kyobo-bg: #d7f5df;  --p-kyobo-fg: #2f8a53;
    --p-yes24-bg: #ffd9ec;  --p-yes24-fg: #b04c85;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: 'Noto Sans KR', sans-serif;
    background: var(--bg);
    color: var(--text);
    min-height: 100vh;
    padding: env(safe-area-inset-top) 16px calc(env(safe-area-inset-bottom) + 24px);
    -webkit-font-smoothing: antialiased;
  }
  header {
    padding: 20px 4px 14px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 12px;
  }
  h1 {
    font-family: 'Poppins', 'Noto Sans KR', sans-serif;
    font-weight: 700;
    font-size: 22px;
    letter-spacing: -0.01em;
  }
  select#dateSelect {
    font-family: 'Noto Sans KR', sans-serif;
    font-size: 13px;
    font-weight: 500;
    color: var(--accent-dark);
    background: var(--card);
    border: 1px solid var(--line);
    border-radius: 10px;
    padding: 8px 10px;
    -webkit-appearance: none;
    appearance: none;
  }
  .shelf {
    display: flex;
    gap: 4px;
    margin: 16px 4px 20px;
    height: 6px;
  }
  .shelf span {
    flex: 1;
    border-radius: 3px;
    background: var(--line);
    transition: background 0.2s;
  }
  .shelf span.active { background: var(--accent); }

  .tabs {
    display: flex;
    gap: 8px;
    margin: 0 4px 20px;
  }
  .tab {
    flex: 1;
    text-align: center;
    padding: 11px 0;
    border-radius: 12px;
    background: var(--card);
    color: var(--text-dim);
    font-size: 14px;
    font-weight: 500;
    cursor: pointer;
    border: 1px solid var(--line);
  }
  .tab.active {
    background: var(--accent-dark);
    color: #ffffff;
    border-color: var(--accent-dark);
  }

  .platform-group { margin-bottom: 22px; }
  .platform-label {
    font-family: 'Poppins', 'Noto Sans KR', sans-serif;
    font-size: 13px;
    font-weight: 600;
    padding: 4px 12px;
    border-radius: 20px;
    display: inline-flex;
    margin: 0 6px 10px;
  }
  .platform-label.알라딘 { background: var(--p-aladin-bg); color: var(--p-aladin-fg); }
  .platform-label.교보문고 { background: var(--p-kyobo-bg); color: var(--p-kyobo-fg); }
  .platform-label.YES24 { background: var(--p-yes24-bg); color: var(--p-yes24-fg); }

  .card {
    background: var(--card);
    color: var(--text);
    border: 1px solid var(--line);
    border-radius: 14px;
    padding: 14px 16px;
    margin-bottom: 8px;
    display: flex;
    gap: 12px;
    align-items: flex-start;
    text-decoration: none;
  }
  .rank {
    font-family: 'Poppins', 'Noto Sans KR', sans-serif;
    font-weight: 700;
    font-size: 18px;
    color: var(--accent-dark);
    min-width: 22px;
  }
  .card-body { flex: 1; min-width: 0; }
  .title {
    font-size: 15px;
    font-weight: 500;
    line-height: 1.4;
  }
  .meta {
    font-size: 12.5px;
    color: var(--text-dim);
    margin-top: 3px;
  }
  .intro {
    font-size: 12.5px;
    color: #6b6680;
    margin-top: 6px;
    line-height: 1.55;
  }

  .idea-card {
    flex-direction: column;
    align-items: stretch;
    gap: 0;
    padding: 18px 18px 16px;
  }
  .idea-hook {
    font-family: 'Poppins', 'Noto Sans KR', sans-serif;
    font-size: 16px;
    font-weight: 600;
    color: var(--accent-dark);
    line-height: 1.5;
    position: relative;
    padding-left: 14px;
  }
  .idea-hook::before {
    content: "“";
    position: absolute;
    left: -4px;
    top: -2px;
    font-size: 20px;
    color: var(--accent);
  }
  .idea-meta {
    font-size: 12.5px;
    color: var(--text-dim);
    margin-top: 10px;
  }
  .idea-reason {
    font-size: 12.5px;
    color: #6b6680;
    margin-top: 8px;
    line-height: 1.55;
    border-top: 1px solid var(--line);
    padding-top: 10px;
  }

  .empty {
    text-align: center;
    color: var(--text-dim);
    padding: 60px 20px;
    font-size: 14px;
    line-height: 1.7;
  }
  .loading {
    text-align: center;
    color: var(--text-dim);
    padding: 60px 20px;
    font-size: 14px;
  }
</style>
</head>
<body>
  <header>
    <h1>북트렌드</h1>
    <select id="dateSelect"></select>
  </header>

  <div class="shelf">
    <span data-platform="알라딘"></span>
    <span data-platform="교보문고"></span>
    <span data-platform="YES24"></span>
  </div>

  <div class="tabs">
    <div class="tab active" data-tab="ranking">일별 랭킹</div>
    <div class="tab" data-tab="sns">SNS 화제의 책</div>
    <div class="tab" data-tab="idea">오늘의 아이디어</div>
  </div>

  <div id="content"><div class="loading">불러오는 중…</div></div>

<script>
const PLATFORM_ORDER = ["알라딘", "교보문고", "YES24"];
let state = { ranking: [], sns: [], idea: [], dates: [] };
let activeTab = "ranking";
let selectedDate = "";

function escapeHtml(s) {
  return (s || "").replace(/[&<>"']/g, (c) => ({
    "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;"
  }[c]));
}

function formatDateLabel(d) {
  if (!d) return d;
  const [y, m, day] = d.split("-");
  return `${Number(m)}월 ${Number(day)}일`;
}

function renderRanking() {
  const container = document.getElementById("content");
  const books = state.ranking.filter((b) => b.date === selectedDate);
  if (!books.length) {
    container.innerHTML = '<div class="empty">이 날짜엔 데이터가 없어요.</div>';
    return;
  }
  let html = "";
  PLATFORM_ORDER.forEach((platform) => {
    const platformBooks = books
      .filter((b) => b.platform === platform)
      .sort((a, b) => Number(a.rank) - Number(b.rank));
    if (!platformBooks.length) return;
    html += `<div class="platform-group"><div class="platform-label ${platform}">${platform}</div>`;
    platformBooks.forEach((b) => {
      html += `
        <a class="card" href="${escapeHtml(b.url)}" target="_blank">
          <div class="rank">${b.rank}</div>
          <div class="card-body">
            <div class="title">${escapeHtml(b.title)}</div>
            <div class="meta">${escapeHtml(b.author)}${b.publisher ? " · " + escapeHtml(b.publisher) : ""}</div>
          </div>
        </a>`;
    });
    html += `</div>`;
  });
  container.innerHTML = html || '<div class="empty">이 날짜엔 데이터가 없어요.</div>';
}

function renderSns() {
  const container = document.getElementById("content");
  const books = state.sns.filter((b) => b.date === selectedDate);
  if (!books.length) {
    container.innerHTML = '<div class="empty">이 날짜엔 데이터가 없어요.</div>';
    return;
  }
  let html = "";
  books.forEach((b, i) => {
    html += `
      <a class="card" href="${escapeHtml(b.url)}" target="_blank">
        <div class="rank">${i + 1}</div>
        <div class="card-body">
          <div class="title">${escapeHtml(b.title)}</div>
          <div class="meta">${escapeHtml(b.author)}</div>
          ${b.intro ? `<div class="intro">${escapeHtml(b.intro)}</div>` : ""}
        </div>
      </a>`;
  });
  container.innerHTML = html;
}

function renderIdea() {
  const container = document.getElementById("content");
  const ideas = state.idea.filter((b) => b.date === selectedDate);
  if (!ideas.length) {
    container.innerHTML = '<div class="empty">이 날짜엔 아이디어가 없어요.</div>';
    return;
  }
  let html = "";
  ideas.forEach((idea) => {
    html += `
      <div class="card idea-card">
        <div class="idea-hook">${escapeHtml(idea.hook)}</div>
        <div class="idea-meta">${escapeHtml(idea.book)}${idea.author ? " · " + escapeHtml(idea.author) : ""}</div>
        ${idea.reason ? `<div class="idea-reason">${escapeHtml(idea.reason)}</div>` : ""}
      </div>`;
  });
  container.innerHTML = html;
}

function render() {
  document.querySelectorAll(".tab").forEach((t) => {
    t.classList.toggle("active", t.dataset.tab === activeTab);
  });
  document.querySelectorAll(".shelf span").forEach((s) => {
    s.classList.toggle("active", activeTab === "ranking");
  });
  if (activeTab === "ranking") renderRanking();
  else if (activeTab === "sns") renderSns();
  else renderIdea();
}

document.querySelectorAll(".tab").forEach((t) => {
  t.addEventListener("click", () => {
    activeTab = t.dataset.tab;
    render();
  });
});

document.getElementById("dateSelect").addEventListener("change", (e) => {
  selectedDate = e.target.value;
  render();
});

fetch("/api/data")
  .then((r) => r.json())
  .then((data) => {
    state = data;
    const select = document.getElementById("dateSelect");
    select.innerHTML = state.dates
      .map((d) => `<option value="${d}">${formatDateLabel(d)}</option>`)
      .join("");
    selectedDate = state.dates[0] || "";
    render();
  })
  .catch(() => {
    document.getElementById("content").innerHTML =
      '<div class="empty">데이터를 불러오지 못했어요.<br>잠시 후 다시 시도해주세요.</div>';
  });
</script>
</body>
</html>
