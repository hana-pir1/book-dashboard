<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="북트렌드">
<link rel="apple-touch-icon" href="/apple-touch-icon.png">
<title>북트렌드 대시보드</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Noto+Serif+KR:wght@500;700&family=Noto+Sans+KR:wght@400;500;700&display=swap" rel="stylesheet">
<style>
  :root {
    --ink: #171f2b;
    --ink-2: #1f2937;
    --parchment: #f6f1e4;
    --parchment-dim: #d8cfb8;
    --gold: #c9a227;
    --plum: #7a2e3b;
    --plum-light: #a4536280;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: 'Noto Sans KR', sans-serif;
    background: var(--ink);
    color: var(--parchment);
    min-height: 100vh;
    padding: env(safe-area-inset-top) 16px calc(env(safe-area-inset-bottom) + 24px);
    -webkit-font-smoothing: antialiased;
  }
  header {
    padding: 20px 4px 14px;
  }
  h1 {
    font-family: 'Noto Serif KR', serif;
    font-weight: 700;
    font-size: 22px;
    letter-spacing: -0.01em;
  }
  .date {
    font-size: 13px;
    color: var(--parchment-dim);
    margin-top: 4px;
  }
  .shelf {
    display: flex;
    gap: 4px;
    margin: 16px 4px 20px;
    height: 6px;
  }
  .shelf span {
    flex: 1;
    border-radius: 3px;
    background: var(--ink-2);
    transition: background 0.2s;
  }
  .shelf span.active { background: var(--gold); }

  .tabs {
    display: flex;
    gap: 8px;
    margin: 0 4px 20px;
  }
  .tab {
    flex: 1;
    text-align: center;
    padding: 11px 0;
    border-radius: 10px;
    background: var(--ink-2);
    color: var(--parchment-dim);
    font-size: 14px;
    font-weight: 500;
    cursor: pointer;
    border: 1px solid transparent;
  }
  .tab.active {
    background: var(--plum);
    color: var(--parchment);
    border-color: var(--gold);
  }

  .platform-group { margin-bottom: 22px; }
  .platform-label {
    font-family: 'Noto Serif KR', serif;
    font-size: 15px;
    font-weight: 700;
    color: var(--gold);
    margin: 0 6px 10px;
    display: flex;
    align-items: center;
    gap: 8px;
  }
  .platform-label::after {
    content: "";
    flex: 1;
    height: 1px;
    background: var(--ink-2);
  }

  .card {
    background: var(--parchment);
    color: var(--ink);
    border-radius: 12px;
    padding: 14px 16px;
    margin-bottom: 8px;
    display: flex;
    gap: 12px;
    align-items: flex-start;
    text-decoration: none;
  }
  .rank {
    font-family: 'Noto Serif KR', serif;
    font-weight: 700;
    font-size: 19px;
    color: var(--plum);
    min-width: 22px;
  }
  .card-body { flex: 1; min-width: 0; }
  .title {
    font-size: 15px;
    font-weight: 500;
    line-height: 1.4;
  }
  .meta {
    font-size: 12.5px;
    color: #6b6250;
    margin-top: 3px;
  }
  .intro {
    font-size: 12.5px;
    color: #4a4438;
    margin-top: 6px;
    line-height: 1.55;
  }

  .empty {
    text-align: center;
    color: var(--parchment-dim);
    padding: 60px 20px;
    font-size: 14px;
    line-height: 1.7;
  }
  .loading {
    text-align: center;
    color: var(--parchment-dim);
    padding: 60px 20px;
    font-size: 14px;
  }
</style>
</head>
<body>
  <header>
    <h1>북트렌드</h1>
    <div class="date" id="dateLabel">불러오는 중…</div>
  </header>

  <div class="shelf">
    <span data-platform="알라딘"></span>
    <span data-platform="교보문고"></span>
    <span data-platform="YES24"></span>
  </div>

  <div class="tabs">
    <div class="tab active" data-tab="ranking">일별 랭킹</div>
    <div class="tab" data-tab="sns">SNS 화제의 책</div>
  </div>

  <div id="content"><div class="loading">불러오는 중…</div></div>

<script>
const PLATFORM_ORDER = ["알라딘", "교보문고", "YES24"];
let state = { ranking: [], sns: [], rankingDate: "", snsDate: "" };
let activeTab = "ranking";

function escapeHtml(s) {
  return (s || "").replace(/[&<>"']/g, (c) => ({
    "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;"
  }[c]));
}

function renderRanking() {
  const container = document.getElementById("content");
  if (!state.ranking.length) {
    container.innerHTML = '<div class="empty">아직 데이터가 없어요.<br>내일 아침 7시에 첫 데이터가 쌓일 거예요.</div>';
    return;
  }
  let html = "";
  PLATFORM_ORDER.forEach((platform) => {
    const books = state.ranking
      .filter((b) => b.platform === platform)
      .sort((a, b) => Number(a.rank) - Number(b.rank));
    if (!books.length) return;
    html += `<div class="platform-group"><div class="platform-label">${platform}</div>`;
    books.forEach((b) => {
      html += `
        <a class="card" href="${escapeHtml(b.url)}" target="_blank">
          <div class="rank">${b.rank}</div>
          <div class="card-body">
            <div class="title">${escapeHtml(b.title)}</div>
            <div class="meta">${escapeHtml(b.author)}${b.publisher ? " · " + escapeHtml(b.publisher) : ""}</div>
          </div>
        </a>`;
    });
    html += `</div>`;
  });
  container.innerHTML = html || '<div class="empty">데이터가 없어요.</div>';
}

function renderSns() {
  const container = document.getElementById("content");
  if (!state.sns.length) {
    container.innerHTML = '<div class="empty">아직 데이터가 없어요.</div>';
    return;
  }
  let html = "";
  state.sns.forEach((b, i) => {
    html += `
      <a class="card" href="${escapeHtml(b.url)}" target="_blank">
        <div class="rank">${i + 1}</div>
        <div class="card-body">
          <div class="title">${escapeHtml(b.title)}</div>
          <div class="meta">${escapeHtml(b.author)}</div>
          ${b.intro ? `<div class="intro">${escapeHtml(b.intro)}</div>` : ""}
        </div>
      </a>`;
  });
  container.innerHTML = html;
}

function render() {
  document.querySelectorAll(".tab").forEach((t) => {
    t.classList.toggle("active", t.dataset.tab === activeTab);
  });
  document.querySelectorAll(".shelf span").forEach((s) => {
    s.classList.toggle("active", activeTab === "ranking");
  });
  if (activeTab === "ranking") renderRanking();
  else renderSns();
  const label = activeTab === "ranking" ? state.rankingDate : state.snsDate;
  document.getElementById("dateLabel").textContent = label ? label + " 기준" : "";
}

document.querySelectorAll(".tab").forEach((t) => {
  t.addEventListener("click", () => {
    activeTab = t.dataset.tab;
    render();
  });
});

fetch("/api/data")
  .then((r) => r.json())
  .then((data) => {
    state = data;
    render();
  })
  .catch(() => {
    document.getElementById("content").innerHTML =
      '<div class="empty">데이터를 불러오지 못했어요.<br>잠시 후 다시 시도해주세요.</div>';
  });
</script>
</body>
</html>
